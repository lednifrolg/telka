[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# ISC and BSD-3-Clause come with the rustls TLS stack.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the unpublished workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
